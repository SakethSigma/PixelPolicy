[project]
name = "inference"
version = "0.1.0"
description = "Inference pipelines — run trained agents against games"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "vllm==0.19.0",         # OpenAI-compatible server engine (server.py launches it). Pinned: 0.19 is
                            # the cu128 + Qwen3.5 window; later vllm ships cu13 wheels (libcudart.so.13).
    # vLLM mounts a prometheus instrumentator; at 8.0.0 it crashes on EVERY request (`route.path` on
    # include_router routes → 500 on /v1/models). vLLM 0.19 itself requires a new starlette (>=0.49),
    # so we DON'T touch starlette/fastapi — we pin only the instrumentator below 8.0.0.
    "prometheus-fastapi-instrumentator<8",
    # Evaluation harness (metrics.py / evaluate.py / run_checkpoints.py):
    "agents",               # rollout (run_eval/win_rate), OpenAICompatBackend, AgentConfig
    "distillation",         # registry.GAMES — generic per-game (agent, env, sample_targets, good_status)
]

[tool.uv]
# Flat-layout namespace package imported via the workspace `pythonpath`, not built as a
# wheel — resolve deps without invoking a build backend.
package = false
